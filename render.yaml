services:
  # Backend FastAPI Web Service
  - type: web
    name: loan-prediction-backend
    env: python
    region: oregon
    plan: free
    rootDir: Frontend and Backend/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URL
        fromService:
          type: web
          name: loan-prediction-frontend
          property: host

  # Frontend React Static Site
  - type: web
    name: loan-prediction-frontend
    env: static
    region: oregon
    plan: free
    rootDir: Frontend and Backend/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: loan-prediction-backend
          property: host
